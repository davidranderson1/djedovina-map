<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Djedovina — obiteljska tvrtka koja sređuje stare zemljišne knjige u splitskom kraju. Vaša zemlja, u dobre ruke.">
<title>Djedovina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#EFE8D6; --ground2:#E6DCC4; --ink:#2B2318; --ink-soft:#5A4F3D;
  --olive:#5C6B3C; --olive-deep:#47542E; --sea:#1E4A56; --terra:#B65C33;
  --card:#F7F2E6; --line:#CBBE9F; --wall:#DDD2B6;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16222A; --ground2:#111B22; --ink:#EDE4CE; --ink-soft:#B9AE94;
    --olive:#93A467; --olive-deep:#A8B87E; --sea:#7FB4C4; --terra:#D6845A;
    --card:#1D2B34; --line:#33454F; --wall:#1A2830;
  }
}
:root[data-theme="dark"]{
  --ground:#16222A; --ground2:#111B22; --ink:#EDE4CE; --ink-soft:#B9AE94;
  --olive:#93A467; --olive-deep:#A8B87E; --sea:#7FB4C4; --terra:#D6845A;
  --card:#1D2B34; --line:#33454F; --wall:#1A2830;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} .step,.stone{transition:none!important}}
body{background:var(--ground);color:var(--ink);font-family:"Source Sans 3",system-ui,Arial,sans-serif;font-size:17px;line-height:1.6}
a{color:var(--sea)}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
header{padding:20px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.wordmark{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:28px;letter-spacing:.02em;color:var(--ink)}
.wordmark .leaf{color:var(--olive)}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:transparent;color:var(--ink-soft);font:600 12px/1 "Source Sans 3",sans-serif;letter-spacing:.08em;padding:7px 9px;border-radius:3px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--ground)}
.langs button:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
/* hero */
.hero{padding:72px 0 56px;position:relative}
.kicker{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;color:var(--olive-deep)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(38px,7vw,64px);line-height:1.06;text-wrap:balance;margin:14px 0 20px;max-width:15ch}
.sub{max-width:58ch;font-size:19px;color:var(--ink-soft)}
.cta{display:inline-block;margin-top:30px;background:var(--terra);color:#FBF6EA;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:3px}
.cta:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
/* root line */
.rootline{position:relative}
.rootline::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:linear-gradient(var(--olive) 60%,transparent 0) 0 0/2px 14px repeat-y;opacity:.55}
/* sections */
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:34px;margin-bottom:8px;text-wrap:balance}
.sect-note{color:var(--ink-soft);max-width:60ch;margin-bottom:30px}
/* pledge stones */
.stones{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.stone{background:var(--card);border:1px solid var(--line);border-radius:2px 14px 3px 12px;padding:20px 18px;position:relative}
.stone h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;margin-bottom:6px}
.stone p{font-size:15px;color:var(--ink-soft)}
.stone::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--olive);border-radius:2px 0 0 2px}
/* steps */
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:24px 1fr;gap:18px;padding:18px 0}
.dot{width:24px;height:24px;border-radius:50%;background:var(--ground);border:2px solid var(--olive);color:var(--olive-deep);font:700 12px/20px "Source Sans 3",sans-serif;text-align:center;z-index:1}
.step h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px}
.step p{color:var(--ink-soft);max-width:60ch}
/* story */
.story p{max-width:62ch;font-size:18px}
.story .sig{margin-top:18px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:var(--olive-deep);font-size:19px}
/* contact */
.contact{background:var(--ground2);border-top:1px solid var(--line)}
.contact .box{background:var(--card);border:1px solid var(--line);padding:28px;border-radius:3px;max-width:640px}
.contact .box p{color:var(--ink-soft);margin-bottom:16px}
#enqForm{display:grid;gap:10px;margin-bottom:14px}
#enqForm input,#enqForm textarea{width:100%;background:var(--ground);border:1px solid var(--line);border-radius:3px;color:var(--ink);padding:10px 12px;font:inherit}
#enqForm button.cta{border:none;cursor:pointer;justify-self:start}
#enqForm button.cta[disabled]{opacity:.6;cursor:default}
footer{padding:34px 0 44px;color:var(--ink-soft);font-size:13px}
.wallstrip{height:34px;background:
  radial-gradient(28px 15px at 14px 18px, var(--wall) 96%, transparent) 0 0/56px 34px,
  radial-gradient(24px 13px at 42px 8px, var(--wall) 96%, transparent) 0 0/56px 34px;
  opacity:.8}
</style>
</head>
<body>

<header class="wrap">
  <div class="bar">
    <div class="wordmark">Djedovina<span class="leaf"> ⌂</span></div>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </div>
</header>

<div class="wrap hero">
  <div class="kicker">Vaša zemlja, u dobre ruke.</div>
  <h1 data-i18n="hero_title"></h1>
  <p class="sub" data-i18n="hero_sub"></p>
  <a class="cta" href="#contact" data-i18n="cta"></a>
</div>

<div class="wallstrip" aria-hidden="true"></div>

<section class="wrap" id="pledge">
  <h2 data-i18n="pledge_title"></h2>
  <p class="sect-note" data-i18n="pledge_note"></p>
  <div class="stones">
    <div class="stone"><h3 data-i18n="p1t"></h3><p data-i18n="p1"></p></div>
    <div class="stone"><h3 data-i18n="p2t"></h3><p data-i18n="p2"></p></div>
    <div class="stone"><h3 data-i18n="p3t"></h3><p data-i18n="p3"></p></div>
    <div class="stone"><h3 data-i18n="p4t"></h3><p data-i18n="p4"></p></div>
    <div class="stone"><h3 data-i18n="p5t"></h3><p data-i18n="p5"></p></div>
  </div>
</section>

<section class="wrap" id="how">
  <h2 data-i18n="how_title"></h2>
  <p class="sect-note" data-i18n="how_note"></p>
  <div class="steps rootline">
    <div class="step"><div class="dot">1</div><div><h3 data-i18n="s1t"></h3><p data-i18n="s1"></p></div></div>
    <div class="step"><div class="dot">2</div><div><h3 data-i18n="s2t"></h3><p data-i18n="s2"></p></div></div>
    <div class="step"><div class="dot">3</div><div><h3 data-i18n="s3t"></h3><p data-i18n="s3"></p></div></div>
    <div class="step"><div class="dot">4</div><div><h3 data-i18n="s4t"></h3><p data-i18n="s4"></p></div></div>
    <div class="step"><div class="dot">5</div><div><h3 data-i18n="s5t"></h3><p data-i18n="s5"></p></div></div>
  </div>
</section>

<section class="wrap story" id="story">
  <h2 data-i18n="story_title"></h2>
  <p data-i18n="story_body"></p>
  <p class="sig" data-i18n="story_sig"></p>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <h2 data-i18n="contact_title"></h2>
    <div class="box">
      <p data-i18n="contact_body"></p>
      <form id="enqForm" novalidate>
        <input type="text" id="eqName" data-i18n-ph="form_name" autocomplete="name">
        <input type="text" id="eqContact" data-i18n-ph="form_contact" autocomplete="email">
        <input type="text" id="eqPlace" data-i18n-ph="form_place">
        <textarea id="eqMsg" rows="4" data-i18n-ph="form_msg"></textarea>
        <input type="text" id="eqWebsite" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;height:0;width:0;border:0;padding:0">
        <button type="submit" class="cta" id="eqSend" data-i18n="form_send"></button>
        <p id="eqStatus" role="status" style="margin-top:10px;min-height:20px"></p>
      </form>
      <a href="mailto:zemlja@djedovina.hr" data-i18n="contact_btn" style="color:var(--olive)"></a>
    </div>
  </div>
</section>

<footer class="wrap"><span data-i18n="footer_note"></span></footer>

const ORDER = ["hr","en","de","it","es","fr","pl","nl","sv"];
let saved=null; try{saved=localStorage.getItem("djedovina-lang")}catch(e){}
let current = saved && I18N[saved] ? saved :
  (ORDER.find(l=>(navigator.language||"en").toLowerCase().startsWith(l)) || "hr");
const nav=document.getElementById("langs");
ORDER.forEach(l=>{
  const b=document.createElement("button");
  b.textContent=I18N[l]._n; b.dataset.lang=l;
  b.addEventListener("click",()=>setLang(l));
  nav.appendChild(b);
});
function setLang(l){
  current=l; try{localStorage.setItem("djedovina-lang",l)}catch(e){}
  document.documentElement.lang=l;
  const d=I18N[l];
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.dataset.i18n; if(d[k]!==undefined) el.textContent=d[k]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ const k=el.dataset.i18nPh; if(d[k]!==undefined) el.placeholder=d[k]; });
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===l)));
}
setLang(current);

const ENQ_URL = "https://zoojmmcdnyciadzktqnx.supabase.co/functions/v1/map-data?what=enquiry";
document.getElementById("enqForm").addEventListener("submit", async function (ev) {
  ev.preventDefault();
  const d = I18N[current];
  const st = document.getElementById("eqStatus");
  const name = document.getElementById("eqName").value.trim();
  const contact = document.getElementById("eqContact").value.trim();
  if (!name || !contact) { st.style.color = "var(--terra)"; st.textContent = d.form_req; return; }
  const btn = document.getElementById("eqSend");
  btn.disabled = true; st.style.color = "var(--ink-soft)"; st.textContent = "…";
  try {
    const r = await fetch(ENQ_URL, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, contact,
        place: document.getElementById("eqPlace").value.trim(),
        message: document.getElementById("eqMsg").value.trim(),
        website: document.getElementById("eqWebsite").value,
        lang: current })
    });
    const out = await r.json();
    if (!r.ok || out.error) throw new Error(out.error || r.status);
    st.style.color = "var(--olive)"; st.textContent = d.form_sent;
    this.reset();
  } catch (e) {
    st.style.color = "var(--terra)"; st.textContent = d.form_err;
  }
  btn.disabled = false;
});
</script>
